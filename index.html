<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pretty Sales Cloud</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--p:#8b3f62;--bg:#f7f4f2;--line:#e6deda;--ink:#282322;--muted:#756d69;--ok:#207451;--soft:#f8eaf1;--bad:#a33d3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,"Segoe UI",sans-serif}header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;font-weight:800;font-size:17px}.logo{background:var(--p);color:#fff;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-right:10px}.user{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px}.wrap{max-width:1180px;margin:auto;padding:25px}.login{max-width:420px;margin:55px auto;background:#fff;border:1px solid var(--line);border-radius:15px;padding:24px}.login h1{margin:0 0 5px}.notice{padding:11px 13px;border-radius:9px;background:#e9f6ef;color:var(--ok);margin:15px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}.head{padding:15px 17px;border-bottom:1px solid var(--line);font-weight:750}.body{padding:17px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.fields.three{grid-template-columns:repeat(3,1fr)}label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer}.btn.primary{background:var(--p);border-color:var(--p);color:white}.actions{display:flex;gap:8px;margin-top:13px}.check{display:flex;align-items:center;gap:8px;margin-top:12px}.check input{width:auto}.error{color:var(--bad);font-size:12px;margin-top:7px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}.tabs .btn.active{background:var(--soft);border-color:#dcb8c9;color:var(--p)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:16px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px}.stat span{display:block;color:var(--muted);font-size:11px}.stat strong{font-size:20px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:880px}.table th,.table td{text-align:left;padding:10px 11px;border-bottom:1px solid var(--line)}.table th{font-size:11px;color:var(--muted);background:#fbfaf9}.pill{font-size:11px;background:var(--soft);color:var(--p);padding:3px 7px;border-radius:999px}.rank{font-weight:800}.empty{text-align:center;padding:28px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:760px){.wrap{padding:16px}.grid{grid-template-columns:1fr}.fields,.fields.three{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}@media(max-width:450px){.fields,.fields.three{grid-template-columns:1fr}}
</style></head><body><header><span class="logo">P</span>Pretty Sales Cloud<div class="user" id="userBox" hidden><span id="userEmail"></span><button class="btn" id="logout">登出</button></div></header>
<section class="login" id="login"><h1>登录销售系统</h1><p style="color:var(--muted)">所有设备使用同一账号即可同步。</p><div class="notice">销售数据已加密连接到 Pretty Sales 云端项目</div><label>电邮</label><input id="email" type="email" autocomplete="email"><label style="margin-top:11px">密码</label><input id="password" type="password" autocomplete="current-password"><div class="actions"><button class="btn primary" id="signIn">登录</button><button class="btn" id="signUp">首次注册</button></div><div class="error" id="authError"></div></section>
<main class="wrap" id="app" hidden><div style="display:flex;justify-content:space-between;gap:15px;align-items:end"><div><h1 style="margin:0">销售记录与排行榜</h1><p style="margin:4px 0;color:var(--muted)">一台设备保存，其他设备会自动更新。</p></div><span class="pill">实时同步</span></div>
<div class="grid" style="margin-top:18px"><section class="card"><div class="head">输入已核对销售</div><div class="body"><div class="fields three"><div><label>分店</label><select id="branch"><option>Sutera</option><option>Eco</option></select></div><div><label>日期</label><input id="date" type="date"></div><div><label>类型</label><select id="type"><option value="package">配套</option><option value="product">产品</option></select></div><div><label>顾客/备注</label><input id="note" placeholder="可不填写顾客姓名"></div><div><label>配套介绍类型</label><select id="packageType"><option value="unknown">不确定</option><option>C</option><option>次</option><option>All</option></select></div><div><label>产品名称</label><input id="product"></div></div><div class="fields three" style="margin-top:11px"><div><label>员工1</label><select class="staff" id="staff1"></select></div><div><label>员工2</label><select class="staff" id="staff2"></select></div><div><label>员工3</label><select class="staff" id="staff3"></select></div><div><label>数量</label><input id="qty" type="number" min="0.5" step="0.5" value="1"></div><div><label>整笔金额 RM</label><input id="money" type="number" min="0" step="0.01"></div></div><label class="check"><input id="counter" type="checkbox">没有员工推荐，归Counter／公司</label><div class="actions"><button class="btn primary" id="save">保存并同步</button></div><div class="error" id="saveError"></div></div></section>
<section class="card"><div class="head">排行榜设定</div><div class="body"><div class="fields"><div><label>分店</label><select id="rankBranch"><option>Sutera</option><option>Eco</option></select></div><div><label>类别</label><select id="rankType"><option value="package">配套</option><option value="product">产品</option></select></div><div><label>月份</label><input id="rankMonth" type="month" value="2026-08"></div><div><label>比赛周期</label><select id="rankPeriod"><option value="first">1–15日</option><option value="second">16日–月底</option><option value="month">整月</option></select></div></div><div class="stats"><div class="stat"><span>员工总额</span><strong id="total">RM0</strong></div><div class="stat"><span>当前阶段</span><strong id="stage">未达标</strong></div><div class="stat"><span>距离下一阶段</span><strong id="remaining">—</strong></div><div class="stat"><span>记录数</span><strong id="count">0</strong></div></div></div></section></div>
<div class="tabs"><button class="btn active" data-view="ranking">排行榜</button><button class="btn" data-view="records">销售明细</button><button class="btn" id="export">下载CSV报告</button></div><section class="card"><div class="table-wrap"><table class="table"><thead id="thead"></thead><tbody id="tbody"></tbody></table><div class="empty" id="empty">还没有资料</div></div></section></main>
<script>
const SUPABASE_URL='https://naflzjfcwuylxqajbkyh.supabase.co',SUPABASE_KEY='sb_publishable_JDXijV2TvuT-mUpqLjVTCQ_8bEQRGUS';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=s=>document.querySelector(s);let session=null,staff=[],targets=[],records=[],view='ranking';$('#date').value=new Date().toISOString().slice(0,10);
async function authState(){const {data}=await db.auth.getSession();session=data.session;$('#login').hidden=!!session;$('#app').hidden=!session;$('#userBox').hidden=!session;if(session){$('#userEmail').textContent=session.user.email;await loadBase();subscribe()}}db.auth.onAuthStateChange(()=>setTimeout(authState));authState();
$('#signIn').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});$('#authError').textContent=error?error.message:''};$('#signUp').onclick=async()=>{const {error}=await db.auth.signUp({email:$('#email').value,password:$('#password').value});$('#authError').textContent=error?error.message:'注册成功，请检查电邮确认链接后再登录。'};$('#logout').onclick=()=>db.auth.signOut();
async function loadBase(){let a=await db.from('staff').select('*').eq('active',true),b=await db.from('targets').select('*'),c=await db.from('sales_records').select('*').order('record_date',{ascending:false});if(a.error||b.error||c.error)return $('#saveError').textContent=(a.error||b.error||c.error).message;staff=a.data;targets=b.data;records=c.data;fillStaff();render()}
function fillStaff(){const names=staff.filter(x=>x.branch===$('#branch').value).map(x=>x.code);document.querySelectorAll('.staff').forEach((el,i)=>el.innerHTML=`<option value="">${i?'不选择':'请选择'}</option>`+names.map(n=>`<option>${n}</option>`).join(''))}$('#branch').onchange=fillStaff;$('#counter').onchange=e=>document.querySelectorAll('.staff').forEach(x=>x.disabled=e.target.checked);$('#type').onchange=e=>{$('#packageType').disabled=e.target.value==='product';$('#product').disabled=e.target.value==='package'};
$('#save').onclick=async()=>{const codes=[...new Set([$('#staff1').value,$('#staff2').value,$('#staff3').value].filter(Boolean))],company=$('#counter').checked;if(!company&&!codes.length)return $('#saveError').textContent='请选择员工或Counter';const row={record_date:$('#date').value,branch:$('#branch').value,customer_note:$('#note').value,sale_type:$('#type').value,package_type:$('#type').value==='package'?$('#packageType').value:'not_applicable',product_name:$('#product').value,staff_codes:company?[]:codes,quantity:+$('#qty').value,amount:+$('#money').value,company_sale:company,created_by:session.user.id};const {error}=await db.from('sales_records').insert(row);$('#saveError').textContent=error?error.message:'';if(!error){$('#note').value='';$('#money').value='';$('#counter').checked=false;document.querySelectorAll('.staff').forEach(x=>{x.value='';x.disabled=false});await loadBase()}};
function filtered(){const m=$('#rankMonth').value,p=$('#rankPeriod').value;return records.filter(r=>r.branch===$('#rankBranch').value&&r.sale_type===$('#rankType').value&&r.record_date.startsWith(m)&&(p==='month'||(p==='first'&&+r.record_date.slice(-2)<=15)||(p==='second'&&+r.record_date.slice(-2)>=16)))}
function rankData(){const rows=filtered(),map={};staff.filter(x=>x.branch===$('#rankBranch').value).forEach(x=>map[x.code]={staff:x.code,amount:0,qty:0});rows.filter(r=>!r.company_sale).forEach(r=>{const n=r.staff_codes.length;r.staff_codes.forEach(s=>{map[s].amount+=+r.amount/n;map[s].qty+=+r.quantity/n})});return Object.values(map).sort((a,b)=>b.amount-a.amount||a.staff.localeCompare(b.staff))}
function render(){const rows=filtered(),rank=rankData(),total=rows.filter(r=>!r.company_sale).reduce((s,r)=>s+ +r.amount,0),kind=$('#rankType').value,period=$('#rankPeriod').value;$('#total').textContent='RM'+total.toLocaleString();$('#count').textContent=rows.length;let stage=null;if(period!=='month')targets.filter(t=>t.sale_type===kind&&t.period_type==='half').sort((a,b)=>a.target_amount-b.target_amount).forEach(t=>{if(total>=t.target_amount)stage=t});$('#stage').textContent=period==='month'?'月度榜':stage?'阶段'+stage.stage:'未达标';const next=period==='month'?null:targets.filter(t=>t.sale_type===kind&&t.period_type==='half'&&total<t.target_amount).sort((a,b)=>a.target_amount-b.target_amount)[0];$('#remaining').textContent=next?'RM'+(next.target_amount-total).toLocaleString():'—';if(view==='ranking'){let prizes=period==='month'?targets.find(t=>t.sale_type===kind&&t.period_type==='month')?.prizes:(stage?.prizes||[]);$('#thead').innerHTML='<tr><th>排名</th><th>员工</th><th>数量</th><th>分配销售额</th><th>暂时奖励</th></tr>';$('#tbody').innerHTML=rank.map((x,i)=>`<tr><td class="rank">${i<3?['🥇','🥈','🥉'][i]:i+1}</td><td>${x.staff}</td><td>x${x.qty}</td><td>RM${x.amount.toLocaleString()}</td><td>${prizes&&prizes[i]?'RM'+prizes[i]:(kind==='package'&&period==='month'&&i>=3&&i<=5?'幸运抽奖':'—')}</td></tr>`).join('')}else{$('#thead').innerHTML='<tr><th>日期</th><th>分店</th><th>类别</th><th>员工</th><th>数量</th><th>金额</th></tr>';$('#tbody').innerHTML=rows.map(r=>`<tr><td>${r.record_date}</td><td>${r.branch}</td><td>${r.sale_type==='package'?'配套 '+r.package_type:'产品 '+r.product_name}</td><td>${r.company_sale?'Counter':r.staff_codes.join(' + ')}</td><td>x${r.quantity}</td><td>RM${(+r.amount).toLocaleString()}</td></tr>`).join('')}$('#empty').style.display=$('#tbody').children.length?'none':'block'}
['rankBranch','rankType','rankMonth','rankPeriod'].forEach(id=>$('#'+id).onchange=render);document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render()});function subscribe(){db.channel('sales-sync').on('postgres_changes',{event:'*',schema:'public',table:'sales_records'},loadBase).subscribe()}$('#export').onclick=()=>{const rows=filtered(),csv='日期,分店,类别,员工,数量,金额\n'+rows.map(r=>[r.record_date,r.branch,r.sale_type,r.company_sale?'Counter':r.staff_codes.join('+'),r.quantity,r.amount].join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download=`pretty-sales-${$('#rankMonth').value}.csv`;a.click()};
</script></body></html>
