<script>
function recordCompetitionId(r){return r.competition_id||r.sale_type}
function competitionById(id){return competitions.find(x=>x.competition_id===id)||{competition_id:id,display_name:id==='package'?'配套销售挑战':id==='product'?'产品销售挑战':id,metric_type:id==='package'||id==='product'?'amount_quantity':'quantity',active:false,display_order:999}}
function competitionName(id){return competitionById(id).display_name}
function competitionMetric(id){return competitionById(id).metric_type||'amount_quantity'}
function metricUsesAmount(id){return ['amount','amount_quantity'].includes(competitionMetric(id))}
function metricUsesQuantity(id){return competitionMetric(id)!=='amount'}
function metricUnit(id){return competitionMetric(id)==='people'?'人':competitionMetric(id)==='count'?'次':'个'}
function monthStartValue(month){return `${month}-01`}
function targetCompetitionId(t){return t.competition_id||t.sale_type}
function monthTargetRows(month,id,period){const type=period==='month'?'month':'half';return targets.filter(t=>targetCompetitionId(t)===id&&String(t.target_month||t.active_from||'').slice(0,7)===month&&t.period_type===type&&+t.target_amount>0).sort((a,b)=>(a.stage||0)-(b.stage||0)||+a.target_amount-+b.target_amount)}
function competitionStages(month,id,period){return monthTargetRows(month,id,period).map(t=>+t.target_amount)}
function primaryScore(rows,id){return metricUsesAmount(id)?rows.reduce((s,r)=>s+(+r.amount||0),0):rows.reduce((s,r)=>s+(+r.quantity||0),0)}
function scoreLabel(value,id){return metricUsesAmount(id)?`RM${neat(value)}`:`${neat(value)}${metricUnit(id)}`}
function competitionVisibleForMonth(c,month){return c.active!==false||records.some(r=>recordCompetitionId(r)===c.competition_id&&r.record_date.startsWith(month))||targets.some(t=>targetCompetitionId(t)===c.competition_id&&String(t.target_month||t.active_from||'').startsWith(month))}
function setSelectOptions(el,items,selected,emptyHtml=''){el.innerHTML=emptyHtml+items.map(x=>`<option value="${esc(x.value)}">${esc(x.label)}</option>`).join('');if(items.some(x=>x.value===selected))el.value=selected}

sprintStats=function(branch,id,month,period,asOf){const start=period==='month'?`${month}-01`:`${month}-${period==='first'?'01':'16'}`,end=period==='month'?sprintEndDate(month,'second'):sprintEndDate(month,period);const rows=records.filter(r=>r.branch===branch&&recordCompetitionId(r)===id&&!r.company_sale&&r.record_date>=start&&r.record_date<=end&&r.record_date<=asOf);return{amount:rows.reduce((s,r)=>s+(+r.amount||0),0),qty:rows.reduce((s,r)=>s+(+r.quantity||0),0)}};
battleCardData=function(branch,id){const month=$('#rankMonth').value||'2026-08',period=$('#rankPeriod').value,date=previousSalesDate(),s=sprintStats(branch,id,month,period,date),stages=competitionStages(month,id,period),score=metricUsesAmount(id)?s.amount:s.qty,next=stages.find(x=>score<x),goal=next||stages.at(-1)||0,remaining=Math.max(0,goal-score);return{branch,type:id,date,s,stages,remaining,done:stages.length>0&&!next,score}};
renderBattleHero=function(){const month=$('#rankMonth').value||'2026-08',period=$('#rankPeriod').value,posterPeriod=period==='month'?'second':period,end=period==='month'?sprintEndDate(month,'second'):sprintEndDate(month,posterPeriod),asOf=previousSalesDate(),days=Math.max(0,Math.ceil((new Date(end+'T00:00:00')-new Date(asOf+'T00:00:00'))/86400000)),available=competitions.filter(c=>competitionVisibleForMonth(c,month)&&(c.active!==false||records.some(r=>recordCompetitionId(r)===c.competition_id&&r.record_date.startsWith(month))));$('#battleKicker').textContent=`${+month.slice(5)}月 · ${period==='first'?'上半月 1–15日':period==='second'?'下半月 16日–月底':'整月总结'}`;$('#battleSubtitle').textContent=days>0?`🚀 最后 ${days} 天 · 全力冲刺！`:'🏆 正式成绩 · 荣耀公布！';const cards=['Sutera','Eco'].flatMap(branch=>available.map(c=>battleCardData(branch,c.competition_id)));$('#battleGrid').innerHTML=cards.map(d=>{const targetHtml=d.stages.length?d.stages.map((v,i)=>{const unlocked=d.score>=v;return`<div class="battle-stage ${unlocked?'unlocked':''}"><span class="stage-icon">${unlocked?'🏆':'🔒'}</span><span class="stage-name">${d.stages.length>1?`第${['一','二','三'][i]||i+1}阶段`:'目标'}</span><span class="stage-value">${scoreLabel(v,d.type)}</span><span class="stage-state">${unlocked?'已解锁':'待挑战'}</span></div>`}).join(''):'<div class="battle-stage"><span class="stage-icon">⚙</span><span class="stage-name">尚未设置</span><span class="stage-value">Target</span><span class="stage-state">请到设置新增</span></div>';return`<article class="battle-card ${d.branch.toLowerCase()}"><div class="battle-card-head">★ ${d.branch.toUpperCase()} · ${esc(competitionName(d.type))} ★</div><div class="battle-date">📅 截至 ${shortDate(d.date)} 的成绩</div><div class="battle-total-label">🔥 ${metricUsesAmount(d.type)?'总额':'总数'}</div><div class="battle-amount">${scoreLabel(d.score,d.type)}</div>${competitionMetric(d.type)==='amount_quantity'?`<div class="battle-qty">（${neat(d.s.qty)}个）</div>`:''}<div class="battle-rush ${d.done?'done':''}">${!d.stages.length?'⚙ 尚未设置Target':d.done?'🏆 已突破最高目标':`🚀 还差 ${scoreLabel(d.remaining,d.type)}！`}</div><div class="battle-stage-title">— 本月奖金目标 —</div><div class="battle-stages" style="grid-template-columns:repeat(${Math.min(3,Math.max(1,d.stages.length))},1fr)">${targetHtml}</div></article>`}).join('')};

const dynamicDrawPosterCardBase=drawPosterCard;drawPosterCard=function(c,x,y,w,h,branch,id,stats,official){const stages=competitionStages($('#sprintMonth').value||$('#rankMonth').value,id,$('#sprintPeriod').value),oldTargets=targets;if(stages.length){const synthetic=stages.map((v,i)=>({sale_type:id,competition_id:id,target_month:monthStartValue($('#sprintMonth').value||$('#rankMonth').value),period_type:'half',stage:i+1,target_amount:v,prizes:[],lucky_draw_ranks:[],qualification:'none',active_from:monthStartValue($('#sprintMonth').value||$('#rankMonth').value)}));targets=[...targets.filter(t=>targetCompetitionId(t)!==id),...synthetic]}try{return dynamicDrawPosterCardBase(c,x,y,w,h,branch,id,stats,official)}finally{targets=oldTargets}};

buildSharePoster=function(){const month=$('#sprintMonth').value||$('#rankMonth').value,period=$('#sprintPeriod').value,date=$('#sprintDate').value||sprintEndDate(month,period),items=[['Sutera','package'],['Sutera','product'],['Eco','package'],['Eco','product']],stats=items.map(x=>sprintStats(x[0],x[1],month,period,date)),targetValues=items.map(x=>competitionStages(month,x[1],period)[0]||0),achieved=stats.filter((s,i)=>targetValues[i]&&(metricUsesAmount(items[i][1])?s.amount:s.qty)>=targetValues[i]).length,stage=$('#sharePosterStage');stage.style.top=window.scrollY+'px';stage.innerHTML=`<section class="share-poster"><div class="sp-noise"></div><div class="sp-frame"></div><header class="sp-header"><div class="sp-ornament left">${spTrophySvg}</div><div class="sp-ornament right">${spMegaphoneSvg}</div><div class="sp-kicker">${+month.slice(5)}月${period==='first'?'上半月（1–15日）':'下半月（16日–月底）'}</div><h1 class="sp-title">正式成绩公布</h1><div class="sp-thanks">◆ 感谢大家这半个月的努力与付出！ ◆</div></header><main class="sp-grid">${items.map((x,i)=>spCardHtml(x[0],x[1],stats[i],targetValues[i],date,i)).join('')}</main><section class="sp-summary"><div class="sp-summary-left"><div class="sp-summary-trophy">${spTrophySvg}</div><div class="sp-summary-title">本阶段成绩总结</div><div class="sp-achieved">${achieved} 项达标</div></div><div class="sp-summary-right"><div class="sp-next">下一阶段继续冲刺！</div><div class="sp-lines">配套目标：${competitionStages(month,'package',period).map(v=>typeTargetLabel(v)).join(' → ')||'未设置'}<br>产品目标：${competitionStages(month,'product',period).map(v=>typeTargetLabel(v)).join(' → ')||'未设置'}</div><div class="sp-motivation">不到最后一天，成绩都有机会逆转！</div></div></section><footer class="sp-footer"><span class="sp-star">★</span> 一起加油，冲刺更高目标！ <span class="sp-star">★</span></footer></section>`;return stage.firstElementChild};

refreshCompetitionUi();render();
</script>
<script>
drawPosterCard=function(c,x,y,w,h,branch,id,stats,official){const sutera=branch==='Sutera',month=$('#sprintMonth').value||$('#rankMonth').value,period=$('#sprintPeriod').value,stages=competitionStages(month,id,period).slice(0,3),score=metricUsesAmount(id)?stats.amount:stats.qty,reached=stages.filter(v=>score>=v),next=stages.find(v=>score<v),remaining=next?Math.max(0,next-score):0,maxed=stages.length>0&&!next;c.save();c.shadowColor='rgba(255,183,35,.48)';c.shadowBlur=15;posterPanelPath(c,x,y,w,h,24);const edge=c.createLinearGradient(x,y,x+w,y+h);edge.addColorStop(0,'#8b5108');edge.addColorStop(.34,'#ffe58b');edge.addColorStop(.68,'#9a5a0b');edge.addColorStop(1,'#fff0a3');c.strokeStyle=edge;c.lineWidth=5;c.fillStyle='#030302';c.fill();c.stroke();c.shadowBlur=0;posterPanelPath(c,x+4,y+4,w-8,68,19);const hg=c.createLinearGradient(x,y,x+w,y);hg.addColorStop(0,sutera?'#c20850':'#078952');hg.addColorStop(.56,sutera?'#4e001c':'#003b27');hg.addColorStop(1,'#050302');c.fillStyle=hg;c.fill();c.strokeStyle='#d39a2e';c.lineWidth=2;c.beginPath();c.moveTo(x+8,y+73);c.lineTo(x+w-8,y+73);c.stroke();c.textAlign='center';c.fillStyle='#ffe47d';c.font='900 23px Arial Black,Segoe UI,sans-serif';c.fillText(`${branch.toUpperCase()} · ${competitionName(id)}`,x+w/2,y+44);c.fillStyle='#f7e9c9';c.font='15px Segoe UI,Arial';c.fillText(`📅 ${shortDate($('#sprintDate').value||previousSalesDate())} 的成绩`,x+w/2,y+99);c.textAlign='left';c.fillStyle='#fff0c0';c.font='800 15px Segoe UI,Arial';c.fillText(metricUsesAmount(id)?'🔥 总额':'🔥 总数',x+24,y+127);posterGoldText(c,scoreLabel(score,id),x+w/2,y+180,42);if(competitionMetric(id)==='amount_quantity'){c.fillStyle='#fff1d4';c.font='16px Arial';c.textAlign='center';c.fillText(`（${neat(stats.qty)}个）`,x+w/2,y+202)}let barY=y+212;if(reached.length&&!maxed){const gx=x+44,gw=w-88,gg=c.createLinearGradient(gx,0,gx+gw,0);gg.addColorStop(0,'#064d25');gg.addColorStop(.5,'#19a94e');gg.addColorStop(1,'#06451f');posterPanelPath(c,gx,barY,gw,30,7);c.fillStyle=gg;c.fill();c.strokeStyle='#61e57d';c.stroke();c.fillStyle='#fff7d5';c.font='800 15px Segoe UI,Arial';c.textAlign='center';c.fillText(`🏆 ${scoreLabel(reached.at(-1),id)} 已达标`,x+w/2,barY+21);barY+=35}const rx=x+32,rw=w-64,rg=c.createLinearGradient(rx,0,rx+rw,0),hasTarget=stages.length>0;if(maxed){rg.addColorStop(0,'#004a28');rg.addColorStop(.5,'#18a956');rg.addColorStop(1,'#003e23')}else if(hasTarget){rg.addColorStop(0,'#650008');rg.addColorStop(.5,'#df1425');rg.addColorStop(1,'#680009')}else{rg.addColorStop(0,'#40310f');rg.addColorStop(.5,'#8c681a');rg.addColorStop(1,'#332408')}c.fillStyle=rg;c.beginPath();c.moveTo(rx+13,barY);c.lineTo(rx+rw,barY);c.lineTo(rx+rw-13,barY+38);c.lineTo(rx,barY+38);c.closePath();c.fill();c.strokeStyle=maxed?'#65ed88':hasTarget?'#ff725b':'#d0a94e';c.stroke();c.fillStyle='#fff5d0';c.font='900 17px Segoe UI,Arial';c.textAlign='center';c.fillText(!hasTarget?'⚙ 尚未设置Target':maxed?'🏆 已突破最高目标':`🚀 还差 ${scoreLabel(remaining,id)}`,x+w/2,barY+25);c.fillStyle='#f0c85e';c.font='800 12px Segoe UI,Arial';c.fillText('— 本月奖金目标 —',x+w/2,y+291);const shown=stages.length?stages:[0],sw=(w-40-(shown.length-1)*10)/shown.length;shown.forEach((v,i)=>drawPosterStage(c,x+20+i*(sw+10),y+303,sw,stages.length>1?`第${['一','二','三'][i]}阶段`:'Target',stages.length?scoreLabel(v,id):'未设置',stages.length&&score>=v));c.restore()};
</script></body></html>
